<p-toast></p-toast>
<div class="container mt-4">
  <div class="card p-4">
    <h4>Edit Student</h4>

    <div class="form-group">
      <label>Name</label>
      <input pInputText [(ngModel)]="student.name" class="form-control" />
    </div>

    <div class="form-group mt-2">
      <label>Email</label>
      <input pInputText [(ngModel)]="student.email" class="form-control" />
    </div>

    <button pButton label="Update" (click)="update()" class="mt-3 w-100"></button>
  </div>
</div>
