<form (ngSubmit)="save()" class="p-fluid">

  <!-- Name Field -->
  <div class="p-field">
    <label for="name">Name</label>
    <input
      id="name"
      type="text"
      pInputText
      [(ngModel)]="student.name"
      name="name"
      required
    />
  </div>

  <!-- Email Field -->
  <div class="p-field">
    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      pInputText
      [(ngModel)]="student.email"
      name="email"
      required
    />
  </div>

  <!-- Save Button -->
  <button
    type="submit"
    pButton
    label="Save"
    icon="pi pi-save"
    class="p-mt-2"
  ></button>

</form>
