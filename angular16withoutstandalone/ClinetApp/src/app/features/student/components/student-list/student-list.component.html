   <!-- Toast container -->
<p-toast></p-toast>

<!-- Delete confirmation dialog -->
<p-dialog 
  header="Confirm Delete" 
  [(visible)]="showDeleteDialog" 
  [modal]="true" 
  [closable]="false" 
  [style]="{ width: '350px' }"
>
  <p>Are you sure you want to delete this student?</p>
  <ng-template pTemplate="footer">
    <button pButton label="Cancel" class="p-button-secondary" (click)="cancelDelete()"></button>
    <button pButton label="Delete" class="p-button-danger" (click)="confirmDelete()"></button>
  </ng-template>
</p-dialog>

<!-- Students table -->
<p-table [value]="students">
  <ng-template pTemplate="header">
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Email</th>
      <th>Actions</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-student>
    <tr>
      <td>{{ student.id }}</td>
      <td>{{ student.name }}</td>
      <td>{{ student.email }}</td>
      <td>
        <button pButton label="Edit" (click)="editStudent(student.id)"></button>
        
        <button pButton type="button" label="Delete" class="p-button-danger" (click)="openDeleteDialog(student.id)"></button>

      </td>
    </tr>
  </ng-template>
</p-table>
